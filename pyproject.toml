[project]
name = "pdf-extraction-tool"
version = "0.1.0"
description = "Extract text from PDF files via CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyPDF2>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.13",
    "pre-commit>=3.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
warn_return_any = false
